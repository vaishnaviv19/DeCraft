config_version: "2.0"
seed: 42
llm_enabled: true
artifacts_dir: artifacts
thresholds:
  min_rows_rule: 5
  formula_strong_match: 0.95
  formula_hypothesis_match: 0.80
  contradicted_match: 0.50
  rel_tol_default: 0.005
  min_rows_corr: 8
  corr_tolerance_small_n: 0.25
  trend_min_points: 5
  trend_tau_min: 0.5
  trend_p_max: 0.10
  break_min_points: 6
  break_min_persist: 2
  break_size_mult: 3.0
  break_bic_margin: 10.0
  break_p_max: 0.05
  flat_pct: 0.05
  llm_retries: 3
  llm_confidence_escalate: 0.70
  max_repairs: 3
  max_generation_tries: 50
  ngram_overlap_max: 8
  tiny_table_max_rows: 4
  jitter_low: 0.60
  jitter_high: 1.60
  min_value_distance: 0.05
  min_headline_distance: 0.10
  k_anonymity_min_rows: 20
  k_anonymity_k: 3
  utility_range_widen: 0.60
  utility_category_share_tol: 0.15
  utility_strong_corr: 0.50
budgets:
  llm_timeout_seconds: 45
  llm_max_output_tokens: 4000
  llm_max_concurrency: 2
  stage_token_budget: 200000
  stage_timeout_seconds: 600

# v3.1: providers (free tiers; verify the real model ids and limits in M8.0)
providers:
  text:
    kind: groq
    model: openai/gpt-oss-120b
    max_concurrency: 2
    limits: {rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000}
  vision:
    kind: cloudflare
    model: "@cf/meta/llama-3.2-11b-vision-instruct"
    max_concurrency: 1
    limits: {rpm: 10, tpm: 100000, rpd: 80, tpd: 400000}
  image:
    kind: cloudflare
    model: "@cf/black-forest-labs/flux-1-schnell"
    images_per_day: 20
    steps: 4

# v3.1: report settings
report:
  period_shift_years: 1
  word_tolerance: 0.15
  min_total_words: 1000
  row_tolerance: 0.20
  row_padding_compress_max: 0.15
  critic_rounds: 2
  critic_param_range: 0.20
  image_retries: 2
  shorten_retries: 2
  reconcile_rounds: 2
  writer_retries: 2
  render_dpi: 110
  image_max_px: 1024
