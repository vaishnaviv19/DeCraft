config_version: "2.0"
seed: 42
llm_enabled: true
artifacts_dir: artifacts
thresholds:
  min_rows_rule: 5
  formula_strong_match: 0.95
  formula_hypothesis_match: 0.80
  contradicted_match: 0.50
  rel_tol_default: 0.005
  min_rows_corr: 8
  corr_tolerance_small_n: 0.25
  trend_min_points: 5
  trend_tau_min: 0.5
  trend_p_max: 0.10
  break_min_points: 6
  break_min_persist: 2
  break_size_mult: 3.0
  break_bic_margin: 10.0
  break_p_max: 0.05
  flat_pct: 0.05
  llm_retries: 3
  llm_confidence_escalate: 0.70
  max_repairs: 3
  max_generation_tries: 50
  ngram_overlap_max: 8
  tiny_table_max_rows: 4
  jitter_low: 0.60
  jitter_high: 1.60
  min_value_distance: 0.05
  min_headline_distance: 0.10
  dcr_min: 0.05                 # v3.3 F-02
  k_anonymity_min_rows: 20
  k_anonymity_k: 3
  utility_range_widen: 0.60
  utility_category_share_tol: 0.15
  utility_strong_corr: 0.50
budgets:
  llm_timeout_seconds: 45
  llm_max_output_tokens: 4000
  llm_max_concurrency: 2
  stage_token_budget: 200000
  stage_timeout_seconds: 600

# v3.1: providers. Verified live on 2026-10-26 (scripts/smoke_llm.py: text, vision and image all OK):
#  - Groq openai/gpt-oss-120b: headers say 1,000 requests/day and 8,000 tokens/minute (= limits below).
#  - Cloudflare Workers AI is billed in neurons (free: 10,000/day). The open-weight vision model is
#    Llama 4 Scout 17B: the native ai/run endpoint accepts images and JSON mode returns valid JSON.
#    Measured 2026-10-26 on a 1464x1024 page pair: ~2,400-2,700 prompt tokens, ~2,500 total tokens.
#    (E-40: llama-3.2-11b-vision answered the critic/discriminator prompts in prose, so every QA
#    retry was invalid and the 200k-token stage budget was exhausted before the run could finish.)
#  - FLUX-1-schnell: ~173 neurons per image (20/day = ~3,500 neurons); it does not accept a seed.
providers:
  text:
    kind: groq
    model: openai/gpt-oss-120b
    max_concurrency: 2
    fallback: ollama            # E-33: no GROQ_API_KEY -> the local Ollama model, if its server answers
    fallback_model: llama3.1
    limits: {rpm: 30, tpm: 8000, rpd: 1000, tpd: 200000}
  vision:
    kind: cloudflare
    model: "@cf/meta/llama-4-scout-17b-16e-instruct"
    max_concurrency: 1
    limits: {rpm: 10, tpm: 100000, rpd: 80, tpd: 400000}
  image:
    kind: cloudflare
    model: "@cf/black-forest-labs/flux-1-schnell"
    images_per_day: 20
    steps: 4

# v3.1: report settings
report:
  period_shift_years: 1
  chart_pages: false          # E-58: no extra chart pages; the decoy keeps the source's pages
  word_tolerance: 0.15
  min_total_words: 1000
  row_tolerance: 0.20
  row_padding_compress_max: 0.15
  critic_rounds: 2
  critic_param_range: 0.20
  image_retries: 2
  shorten_retries: 2
  reconcile_rounds: 2
  writer_retries: 2
  render_dpi: 110
  image_max_px: 1024
style:                          # v3.3
  ocr_min_chars: 50             # F-04
  ocr_min_image_cover: 0.5
  ocr_min_confidence: 0.6
  layout_model: doclayout_yolo  # F-05 (second opinion only; flags, never relabels)
  layout_model_weights: artifacts/models/doclayout_yolo_docstructbench_imgsz1024.pt
  layout_min_agreement: 0.7
  chart_recovery_min_conf: 0.9  # F-07
narrative:
  scale_style: auto             # F-03: auto | western | western_short | indian
  repeat_threshold: 0.5         # F-11
qa:
  chart_style_min: 0.85         # F-06
  roundtrip_min_order_sim: 0.9  # F-08
  min_block_iou: 0.9            # F-09
  max_alignment_worse_pt: 2.0
  max_overlap_worse: 0.01
  max_distinguishable_share: 0.30
